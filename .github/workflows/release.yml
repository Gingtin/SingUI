name: Release & Build Multi-Arch Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ${{ matrix.target.os }}-${{ matrix.target.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { os: linux, arch: amd64, ext: "" }
          - { os: linux, arch: arm64, ext: "" }
          - { os: windows, arch: amd64, ext: ".exe" }
          - { os: darwin, arch: arm64, ext: "" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Build Backend Binary
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: 0
        run: |
          cd backend
          VERSION=${{ github.ref_name }}
          if [ -z "$VERSION" ]; then VERSION="v1.0.0-dev"; fi
          go build -ldflags="-s -w -X 'main.Version=${VERSION}'" -o singbox-ui-${{ matrix.target.os }}-${{ matrix.target.arch }}${{ matrix.target.ext }} ./cmd/server

      - name: Package Artifacts
        run: |
          cd backend
          if [ "${{ matrix.target.os }}" = "windows" ]; then
            zip singbox-ui-${{ matrix.target.os }}-${{ matrix.target.arch }}.zip singbox-ui-${{ matrix.target.os }}-${{ matrix.target.arch }}.exe
          else
            tar -czvf singbox-ui-${{ matrix.target.os }}-${{ matrix.target.arch }}.tar.gz singbox-ui-${{ matrix.target.os }}-${{ matrix.target.arch }}
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            backend/singbox-ui-${{ matrix.target.os }}-${{ matrix.target.arch }}.*
          generate_release_notes: true
